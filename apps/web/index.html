<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>日报助手 · 运营管理后台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="crm.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="review-design.css">
</head>
<body class="logged-out">
  <div class="app-shell">
    <header class="workspace-header">
      <button id="menu-toggle" class="icon-button" type="button" aria-label="打开导航">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand-block">
        <div class="brand-mark">助</div>
        <div><h1>日报助手</h1><p id="workspace-identity">企业与工作协同</p></div>
      </div>
      <p class="header-title sr-only" id="header-title">运营工作台</p>
      <div class="header-tools">
        <span class="runtime-state"><span class="status-dot"></span><span id="runtime-clock">实时运行中</span></span>
        <span class="company-name">示例企业</span>
      </div>
    </header>
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav" aria-label="主导航">
        <a href="#/workspace" data-route="workspace"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2v8.3a.5.5 0 0 1-.5.5h-5v-6h-5v6h-5a.5.5 0 0 1-.5-.5z"/></svg></span>工作台</a>
        <a href="#/companies" data-route="companies"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V6h10v14M14 10h6v10M8 10h2M8 14h2M8 18h2M17 14h1M17 17h1M2 20h20"/></svg></span>企业管理</a>
        <a href="#/records" data-route="records"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/></svg></span>工作记录</a>
        <a href="#/users" data-route="users"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15 19v-1.5A3.5 3.5 0 0 0 11.5 14h-5A3.5 3.5 0 0 0 3 17.5V19M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM16 11a2.5 2.5 0 1 0 0-5M17 14a3.5 3.5 0 0 1 4 3.5V19"/></svg></span>人员管理</a>
        <a href="#/knowledge" data-route="knowledge"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg></span>知识管理</a>
        <a href="#/settings" data-route="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4ZM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.56V20h-3v-.08a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 14.7a1.7 1.7 0 0 0-1.56-1H5v-3h.44A1.7 1.7 0 0 0 7 9.7a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.56V4h3v.48a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1H20v3h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg></span>系统设置</a>
      </nav>
      <div class="sidebar-footer">
        <span class="user-avatar">助</span>
        <span class="sidebar-user-copy"><strong id="workspace-user"></strong><small>当前登录账号</small></span>
        <button id="logout" class="sidebar-logout" type="button" aria-label="退出登录" title="退出登录"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg></button>
      </div>
    </aside>
    <section class="workspace">
      <div class="workspace-view-control"><label for="workspace-view">工作视角</label><select id="workspace-view" aria-label="工作视角" hidden><option value="personal">员工端 · 我的工作</option><option value="team">管理端 · 团队管理</option></select></div>
      <main id="app" class="content"></main>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="crm.js"></script>
  <script src="workspace.js"></script>
  <script src="reporting.js"></script>
  <script src="app.js"></script>
</body>
</html>
